name: Build FIRST VPN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project
        run: |
          echo "=== PROJECT FILES ==="
          find . -maxdepth 5 -type f | sort
          echo "=== GRADLE VERSION ==="
          gradle --version

      - name: Build APK
        run: |
          gradle --stacktrace --info assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FIRST-VPN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
