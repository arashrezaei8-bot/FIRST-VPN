name: Build FIRST VPN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Show files
        run: |
          echo "===== FILES ====="
          find . -type f | sort

      - name: Build
        run: |
          echo "===== START BUILD ====="
          gradle --stacktrace --info assembleDebug
